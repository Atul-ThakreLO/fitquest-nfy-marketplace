specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: TerritoryNFT
    network: base-sepolia
    source:
      address: "0x6c9F32c9cec98Ccb78eB2382aCBB268801FD6941"
      abi: TerritoryNFT
      startBlock: 39859809
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Token
        - User
      abis:
        - name: TerritoryNFT
          file: ../shared/src/abis/TerritoryNFT.json
      eventHandlers:
        - event: TokenMinted(indexed uint256,indexed address,uint8)
          handler: handleTokenMinted
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
        - event: FirstListingMarked(indexed uint256)
          handler: handleFirstListingMarked
      file: ./src/territory-nft.ts

  - kind: ethereum
    name: TerritoryMarketplace
    network: base-sepolia
    source:
      address: "0xCA62A34eF6C49e8604Ca88A72A7cb6E2D4A101a9"
      abi: TerritoryMarketplace
      startBlock: 39859988
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Listing
        - Sale
        - Token
        - User
      abis:
        - name: TerritoryMarketplace
          file: ../shared/src/abis/TerritoryMarketplace.json
        - name: TerritoryNFT
          file: ../shared/src/abis/TerritoryNFT.json
      eventHandlers:
        - event: Listed(indexed uint256,indexed address,uint256)
          handler: handleListed
        - event: Sold(indexed uint256,indexed address,indexed address,uint256)
          handler: handleSold
        - event: ListingCancelled(indexed uint256)
          handler: handleListingCancelled
        - event: PriceUpdated(indexed uint256,uint256)
          handler: handlePriceUpdated
      file: ./src/territory-marketplace.ts

  - kind: ethereum
    name: TerritoryAuction
    network: base-sepolia
    source:
      address: "0xaEb4F9E488F8B8315CE799a65cC217775acB3282"
      abi: TerritoryAuction
      startBlock: 39844623
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Auction
        - Bid
        - Token
        - User
      abis:
        - name: TerritoryAuction
          file: ../shared/src/abis/TerritoryAuction.json
      eventHandlers:
        - event: AuctionCreated(indexed uint256,indexed uint256,indexed address,uint256,uint256)
          handler: handleAuctionCreated
        - event: BidPlaced(indexed uint256,indexed address,uint256)
          handler: handleBidPlaced
        - event: AuctionFinalized(indexed uint256,indexed address,uint256)
          handler: handleAuctionFinalized
        - event: AuctionCancelled(indexed uint256)
          handler: handleAuctionCancelled
        - event: AuctionCancelledNoBids(indexed uint256)
          handler: handleAuctionCancelledNoBids
      file: ./src/territory-auction.ts
